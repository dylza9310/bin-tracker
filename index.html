<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bin Night Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'DM Sans', sans-serif;
  }

  .card {
    background: #f5f0e8;
    border-radius: 24px;
    padding: 36px 32px 40px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
    border-bottom: 2px solid #1a1a2e;
    padding-bottom: 20px;
  }

  .bin-icon { font-size: 36px; line-height: 1; }

  .header-text h1 {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 900;
    color: #1a1a2e;
    line-height: 1.1;
  }

  .header-text p { font-size: 13px; color: #666; margin-top: 3px; }

  .week {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid #ddd6c8;
  }

  .week:last-of-type { border-bottom: none; }

  .week.tonight {
    background: #1a1a2e;
    border-radius: 14px;
    padding: 16px;
    margin: 0 -4px;
    border-bottom: none;
  }

  .week.past { opacity: 0.35; }

  .date-col { min-width: 90px; }

  .date-day {
    font-family: 'Fraunces', serif;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #888;
  }

  .tonight .date-day { color: #aaa; }

  .date-num {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 900;
    color: #1a1a2e;
    line-height: 1.1;
  }

  .tonight .date-num { color: #f5f0e8; }

  .date-month { font-size: 12px; color: #999; font-weight: 500; }
  .tonight .date-month { color: #aaa; }

  .bins { display: flex; gap: 8px; flex-wrap: wrap; }

  .bin {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 500;
  }

  .bin .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .bin.green { background: #d4edda; color: #1a5c2a; }
  .bin.green .dot { background: #28a745; }
  .bin.brown { background: #e8d5c4; color: #5c3010; }
  .bin.brown .dot { background: #8b4513; }
  .bin.black { background: #2d2d2d; color: #e0e0e0; }
  .bin.black .dot { background: #777; }

  .tonight .bin.green { background: rgba(40,167,69,0.25); color: #7dd99a; }
  .tonight .bin.brown { background: rgba(139,69,19,0.3); color: #d4956a; }
  .tonight .bin.black { background: rgba(255,255,255,0.1); color: #ccc; }

  .tonight-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    background: #f5f0e8;
    color: #1a1a2e;
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 6px;
  }

  .next-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    background: #1a1a2e;
    color: #f5f0e8;
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 6px;
  }

  .legend {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 2px solid #1a1a2e;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #555;
    font-weight: 500;
  }

  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  .footer-note { margin-top: 10px; font-size: 11px; color: #999; text-align: center; }

  /* WhatsApp share button */
  .share-wrap {
    margin-top: 20px;
  }

  .share-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px;
    background: #25D366;
    color: #fff;
    border: none;
    border-radius: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s, transform 0.1s;
  }

  .share-btn:hover { background: #1ebe5a; }
  .share-btn:active { transform: scale(0.98); }

  .share-btn svg { flex-shrink: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="bin-icon">🗑️</div>
    <div class="header-text">
      <h1>Bin Night<br>Schedule</h1>
      <p>Put out the night before collection</p>
    </div>
  </div>

  <div id="weeks"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#28a745"></div>Green – recycling</div>
    <div class="legend-item"><div class="legend-dot" style="background:#8b4513"></div>Brown – garden/food</div>
    <div class="legend-item"><div class="legend-dot" style="background:#777"></div>Black – general waste</div>
  </div>
  <div class="footer-note">Green + Brown alternate with Black every week</div>

  <div class="share-wrap">
    <a id="wa-btn" class="share-btn" target="_blank">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="white">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      Remind the group
    </a>
  </div>
</div>

<script>
  const ANCHOR = new Date(2026, 4, 20);
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function getWeekIndex(date) {
    const msPerWeek = 7 * 24 * 60 * 60 * 1000;
    return Math.floor((date - ANCHOR) / msPerWeek);
  }

  function isGreenBrown(weekIndex) {
    return weekIndex % 2 === 0;
  }

  function renderBins(greenBrown) {
    if (greenBrown) {
      return `<div class="bin green"><div class="dot"></div>Green</div>
              <div class="bin brown"><div class="dot"></div>Brown</div>`;
    } else {
      return `<div class="bin black"><div class="dot"></div>Black</div>`;
    }
  }

  function buildWhatsAppMessage(gb, dateNum, month) {
    const bins = gb ? '🟢 Green + 🟤 Brown bins' : '⚫ Black bin';
    return `🗑️ Bin night reminder!\n\nTonight (${dateNum} ${month}): put out the ${bins}.\n\nDon't forget to bring them back in tomorrow! ♻️`;
  }

  function render() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const todayWeekIdx = getWeekIndex(today);
    const container = document.getElementById('weeks');
    container.innerHTML = '';

    let tonightGB = true;
    let tonightDateNum = '';
    let tonightMonth = '';

    for (let i = -1; i < 7; i++) {
      const weekIdx = todayWeekIdx + i;
      const weekDate = new Date(ANCHOR.getTime() + weekIdx * 7 * 24 * 60 * 60 * 1000);
      const isPast = i < 0;
      const isTonight = i === 0;
      const isNext = i === 1;

      const dayName = DAYS[weekDate.getDay()];
      const dateNum = weekDate.getDate();
      const month = MONTHS[weekDate.getMonth()];
      const gb = isGreenBrown(weekIdx);

      if (isTonight) {
        tonightGB = gb;
        tonightDateNum = dateNum;
        tonightMonth = month;
      }

      let classes = 'week';
      if (isTonight) classes += ' tonight';
      if (isPast) classes += ' past';

      let badge = '';
      if (isTonight) badge = '<div class="tonight-badge">Tonight!</div>';
      else if (isNext) badge = '<div class="next-badge">Next</div>';

      container.innerHTML += `
        <div class="${classes}">
          <div class="date-col">
            ${badge}
            ${!badge ? `<div class="date-day">${dayName}</div>` : ''}
            <div class="date-num">${dateNum} ${month}</div>
          </div>
          <div class="bins">${renderBins(gb)}</div>
        </div>`;
    }

    // Build WhatsApp share link
    const msg = buildWhatsAppMessage(tonightGB, tonightDateNum, tonightMonth);
    const encoded = encodeURIComponent(msg);
    document.getElementById('wa-btn').href = `https://wa.me/?text=${encoded}`;
  }

  render();
</script>
</body>
</html>
